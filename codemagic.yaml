# Codemagic CI/CD — SmartSchoolPro (Capacitor)
# A pasta android/ não é versionada: é gerada no build com `cap add android`.
workflows:
  android-release:
    name: Android Release (AAB + APK)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
      node: 20
      android_signing:
        - smartschoolpro_keystore   # nome do keystore carregado em Codemagic > Code signing identities
      groups:
        - google_play                # opcional: GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      vars:
        PACKAGE_NAME: "app.lovable.smartschoolpro"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Instalar dependências
        script: |
          npm ci || npm install
      - name: Gerar pasta web (capacitor-www)
        script: |
          npm run cap:build
      - name: Criar/sincronizar projeto Android
        script: |
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android
      - name: Aplicar permissões de notificação e versão
        script: |
          node scripts/android-prepare.mjs
        # define permissões (SCHEDULE_EXACT_ALARM, POST_NOTIFICATIONS, ...)
        # e versionCode/versionName a partir do build number
      - name: Build AAB + APK release
        script: |
          cd android
          ./gradlew bundleRelease assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - pedroernita22@gmail.com
        notify:
          success: true
          failure: true
      # Descomente após configurar a conta de serviço do Google Play
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: true

  android-debug:
    name: Android Debug (APK de teste)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      java: 17
      node: 20
    scripts:
      - name: Instalar dependências
        script: npm ci || npm install
      - name: Gerar pasta web
        script: npm run cap:build
      - name: Criar/sincronizar projeto Android
        script: |
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android
      - name: Permissões de notificação
        script: node scripts/android-prepare.mjs
      - name: Build APK debug
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
